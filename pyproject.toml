[tool.ruff]
line-length = 125

[tool.ruff.lint]
ignore = []
select = [
	# pycodestyle error
	"E",
	# pycodestyle warning
	"W",
	# Pyflakes
	"F",
	# isort
	"I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.poetry]
name = "samodelkin-bot"
version = "0.1.0"
description = ""
authors = ["Andrei Semenov"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
slack-sdk = "^3.34.0"
slack-bolt = "^1.22.0"
jira = "^3.8.0"
google = "^3.0.0"
google-api-python-client = "^2.161.0"
pytest = "^8.3.4"
fastapi = "^0.115.11"
aiologger = "^0.7.0"
aiohttp = "^3.11.13"
uvicorn = "^0.34.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
